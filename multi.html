<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>語言 Flash Card</title>
<script src="words.js"></script>
<style>
  :root{
    --bg:#f5f3ef; --card:#ffffff; --text:#1f1b16; --muted:#7a7368;
    --accent:#c1440e; --accent2:#2f6f4e; --border:#e2ddd3; --danger:#b23a2f;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#181512; --card:#242019; --text:#f2ede4; --muted:#a89e8f;
      --accent:#e07b45; --accent2:#5fae83; --border:#3a342b; --danger:#e0665a;
    }
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,"Segoe UI",Helvetica,Arial,"PingFang TC","Microsoft JhengHei",sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh;
  }
  .wrap{max-width:640px; margin:0 auto; padding:20px 16px 60px;}
  h1{font-size:1.3rem; margin:0 0 4px;}
  .sub{color:var(--muted); font-size:0.85rem; margin-bottom:18px;}
  .toolbar{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;}
  button{
    font-family:inherit; font-size:0.9rem; padding:9px 14px; border-radius:10px;
    border:1px solid var(--border); background:var(--card); color:var(--text); cursor:pointer;
  }
  button:hover{border-color:var(--accent);}
  button.primary{background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600;}
  button.secondary{background:var(--accent2); color:#fff; border-color:var(--accent2); font-weight:600;}
  button:disabled{opacity:0.5; cursor:default;}
  input[type=file]{display:none;}
  input[type=text], input[type=password], input[type=number], textarea, select{
    font-family:inherit; font-size:0.9rem; padding:9px 12px; border-radius:10px;
    border:1px solid var(--border); background:var(--card); color:var(--text); flex:1; min-width:200px;
  }
  select{flex:0 0 auto; min-width:0;}
  textarea{width:100%; resize:vertical; font-size:1rem;}
  .note{font-size:0.75rem; color:var(--muted); margin:-6px 0 12px;}
  .list{background:var(--card); border:1px solid var(--border); border-radius:14px; overflow:hidden; margin-bottom:16px;}
  .item{display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px; padding:10px 14px; border-bottom:1px solid var(--border);}
  .item:last-child{border-bottom:none;}
  .item .id-text{font-weight:600;}
  .item .meaning{color:var(--muted); font-size:0.82rem;}
  .item.no-data .id-text{color:var(--muted);}
  .item.no-data .meaning{color:var(--danger);}
  /* 文字區塊固定佔滿一整行，按鈕多的話會自動排到下一行，不會把單字擠成一個字母一行 */
  .item > div{flex:1 1 100%; min-width:0;}
  .speak-btn{flex:0 0 auto; padding:6px 10px; font-size:1rem; border-radius:10px;}
  .speak-btn.recording{background:var(--danger); color:#fff; border-color:var(--danger);}
  .speak-btn:disabled{opacity:0.5;}
  .delete-btn{flex:0 0 auto; padding:6px 10px; font-size:1rem; border-radius:10px;}
  .delete-btn:hover{border-color:var(--danger); color:var(--danger);}
  .badge-row{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px;}
  .badge{font-size:0.72rem; padding:3px 8px; border-radius:999px; background:var(--bg); border:1px solid var(--border); color:var(--muted);}
  .badge:hover{border-color:var(--accent); color:var(--accent);}
  .usage-btn{flex:0 0 auto; padding:6px 10px; font-size:1rem; border-radius:10px;}
  .usage-panel{padding:10px 14px 14px; border-bottom:1px solid var(--border); background:var(--bg); font-size:0.88rem;}
  .usage-panel.hidden{display:none;}
  .usage-example{margin-bottom:10px; padding-bottom:10px; border-bottom:1px dashed var(--border);}
  .usage-example:last-child{margin-bottom:0; padding-bottom:0; border-bottom:none;}
  .usage-id{font-weight:600; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .usage-word{cursor:pointer; border-radius:4px; padding:0 1px;}
  .usage-word:hover{background:var(--bg);}
  .usage-word.in-list{color:var(--accent2); text-decoration:underline; text-decoration-style:dotted;}
  .usage-zh{color:var(--muted); margin-top:2px;}
  .usage-note{color:var(--muted); font-size:0.8rem; margin-top:4px; font-style:italic;}
  .diff-chip{
    flex:0 0 auto; width:30px; padding:0; height:30px; line-height:28px; text-align:center;
    font-weight:700; font-size:0.8rem; color:var(--muted);
  }
  .diff-chip.diff-E{border-color:var(--accent2); color:var(--accent2);}
  .diff-chip.diff-M{border-color:#c9a227; color:#c9a227;}
  .diff-chip.diff-H{border-color:var(--danger); color:var(--danger);}
  .count{font-size:0.85rem; color:var(--muted); margin-bottom:10px;}
  .actions{display:flex; gap:10px; flex-wrap:wrap;}
  .hidden{display:none !important;}

  .card-area{background:var(--card); border:1px solid var(--border); border-radius:18px; padding:32px 20px; text-align:center; min-height:220px; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; user-select:none;}
  .card-area .front{font-size:1.5rem; font-weight:700;}
  .front-pron{font-size:0.95rem; color:var(--muted); margin-top:4px;}
  .item .pron{color:var(--muted); font-weight:400; font-size:0.85rem;}
  .card-area .back{font-size:1.05rem; color:var(--accent2); margin-top:12px;}
  .listen-btn{margin-top:14px; padding:9px 16px; border-radius:999px; font-weight:600;}
  .listen-btn.speaking{opacity:0.6;}
  .progress{text-align:center; color:var(--muted); font-size:0.85rem; margin:10px 0;}
  .nav{display:flex; justify-content:center; gap:10px; margin-top:16px;}

  .quiz-en{font-size:1.15rem; font-weight:600; margin:18px 0; text-align:center;}
  .opt-row{display:flex; gap:8px; margin-bottom:10px;}
  .opt{display:block; width:100%; text-align:left; padding:12px 14px; border-radius:12px; flex:1; margin-bottom:0;}
  .opt-speak{flex:0 0 auto; padding:0 14px; border-radius:12px; font-size:1rem;}
  .opt.correct{background:var(--accent2) !important; color:#fff !important; border-color:var(--accent2) !important;}
  .opt.wrong{background:var(--danger) !important; color:#fff !important; border-color:var(--danger) !important;}
  .score{text-align:center; font-size:1.1rem; margin:20px 0;}
  .missed{font-size:0.85rem; color:var(--muted); margin-top:10px;}

  .write-hint{color:var(--muted); font-size:0.9rem; text-align:center; margin:-8px 0 18px;}
  .write-feedback{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px; margin-top:16px;}
  .write-feedback .verdict{font-weight:800; margin:0 0 8px;}
  .write-feedback .verdict.ok{color:var(--accent2);}
  .write-feedback .verdict.no{color:var(--danger);}
  .write-feedback .ref{color:var(--muted); margin:8px 0 0;}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="pageTitle">🇮🇩 印尼語 Flash Card</h1>
  <div class="toolbar">
    <button class="lang-btn" data-lang="id">🇮🇩 印尼文</button>
    <button class="lang-btn" data-lang="th">🇹🇭 泰文</button>
    <button class="lang-btn" data-lang="vi">🇻🇳 越南文</button>
    <button class="lang-btn" data-lang="ja">🇯🇵 日文</button>
    <button class="lang-btn" data-lang="ko">🇰🇷 韓文</button>
  </div>
  <div class="toolbar hidden" id="viDialectBar">
    <label for="viDialect" style="align-self:center;">越南語口音</label>
    <select id="viDialect">
      <option value="nam">南部（胡志明市）</option>
      <option value="bac">北部（河內）</option>
    </select>
  </div>
  <div class="sub">從單字清單勾選要複習的內容，開始 Flashcard 或測驗</div>

  <!-- ===== 選字畫面 ===== -->
  <div id="screen-select">
    <div class="toolbar">
      <button id="btnImport">匯入 / 更新單字檔 (.txt/.md)</button>
      <input type="file" id="fileInput" accept=".txt,.md">
      <button id="btnAll">全選</button>
      <button id="btnNone">全不選</button>
      <button id="btnClearMastered">🔄 清空所有已學會</button>
      <button id="btnClearWordList">🗑️ 清空目前單字表</button>
      <button id="btnDedupByMeaning">🧹 合併中文意思重複的單字</button>
    </div>
    <div class="toolbar hidden" id="convertBar">
      <button id="btnImportConvertTh">📥 匯入並自動生成資料（新增不覆蓋）</button>
      <input type="file" id="fileInputConvertTh" accept=".txt,.md">
    </div>
    <div class="note hidden" id="convertNote"></div>
    <div class="toolbar hidden" id="pendingSyncBar">
      <button id="btnCopyPending">📋 複製句子新增、還沒同步進 Obsidian 的單字</button>
    </div>
    <div class="toolbar">
      <input type="number" id="randomCount" min="1" step="1" value="30" style="max-width:90px; flex:0 0 auto;">
      <button id="btnRandomSelect">🎲 隨機選這麼多個來練習</button>
    </div>
    <div class="toolbar">
      <input type="password" id="apiKeyInput" placeholder="Anthropic API Key (sk-ant-...)">
      <button id="btnSaveKey">儲存 Key</button>
    </div>
    <div class="note">Key 只會存在這台電腦的瀏覽器裡（localStorage），不會上傳到別的地方。用來讓 AI 幫新單字自動生成翻譯和測驗句。</div>
    <div class="toolbar">
      <input type="password" id="openaiKeyInput" placeholder="OpenAI API Key (sk-...)">
      <button id="btnSaveOpenaiKey">儲存 Key</button>
    </div>
    <div class="note">用於「跑步聽力模式」把單字轉成真正的音檔（存在這台電腦，同一個字只會生成一次，之後重播不再花錢）。</div>
    <div class="toolbar">
      <button id="btnGenerate">✨ AI 自動生成缺少的翻譯</button>
    </div>
    <div class="toolbar">
      <input type="text" id="wordSearch" placeholder="搜尋印尼文或中文...">
      <button id="btnToggleSelectedOnly">只顯示已選取</button>
      <button id="btnSortAZ">🔤 A→Z 排序</button>
      <select id="difficultyFilter">
        <option value="">全部難度</option>
        <option value="E">E 簡單</option>
        <option value="M">M 中等</option>
        <option value="H">H 困難</option>
        <option value="none">未標記</option>
      </select>
    </div>
    <div class="count" id="selCount"></div>
    <div class="list" id="wordList"></div>
    <div class="toolbar">
      <label for="thinkPause" style="align-self:center;">思考停頓秒數</label>
      <input type="number" id="thinkPause" min="1" max="15" value="3" style="max-width:70px; flex:0 0 auto;">
    </div>
    <div class="toolbar">
      <label for="voiceSource" style="align-self:center;">發音來源（單字表、Flash Card、測驗、跑步模式全部通用）</label>
      <select id="voiceSource">
        <option value="system">電腦內建語音（免費）</option>
        <option value="gpt" selected>GPT 語音（OpenAI TTS，需要 API Key，發音較準）</option>
      </select>
    </div>
    <div class="actions">
      <button class="primary" id="btnStartCards">開始 Flash Card 複習</button>
      <button id="btnCardDirection"></button>
      <button class="secondary" id="btnStartQuiz">開始測驗（英文選印尼文）</button>
      <button class="secondary" id="btnStartWrite">✍️ 中翻印尼文（AI 出句、AI 批改）</button>
      <button class="secondary" id="btnStartListen">🏃 跑步聽力模式</button>
    </div>
  </div>

  <!-- ===== Flash Card 畫面 ===== -->
  <div id="screen-cards" class="hidden">
    <div class="progress" id="cardProgress"></div>
    <div class="card-area" id="cardArea">
      <div class="front" id="cardFront"></div>
      <div class="front-pron" id="cardPron"></div>
      <button type="button" class="listen-btn" id="cardSpeak">🔊 播放發音</button>
      <div class="back hidden" id="cardBack"></div>
    </div>
    <div class="nav hidden" id="cardAssessRow">
      <button id="btnCardWrong">✗ 還要練習</button>
      <button class="secondary" id="btnCardRight">✓ 記得了，不再出現</button>
    </div>
    <div class="nav">
      <button id="btnPrev">← 上一個</button>
      <button id="btnShuffleCards">🔀 洗牌</button>
      <button id="btnNext">下一個 →</button>
    </div>
    <div class="actions" style="margin-top:16px;">
      <button id="btnBackFromCards">返回清單</button>
    </div>
  </div>

  <!-- ===== 測驗畫面 ===== -->
  <div id="screen-quiz" class="hidden">
    <div class="progress" id="quizProgress"></div>
    <div class="quiz-en" id="quizEnText"></div>
    <div id="quizOptions"></div>
    <div class="actions">
      <button class="primary hidden" id="btnNextQuestion">下一題</button>
      <button class="secondary hidden" id="btnMastered">✓ 已記住，不再出現</button>
      <button id="btnBackFromQuiz">返回清單</button>
    </div>
  </div>

  <!-- ===== 造句測驗畫面 ===== -->
  <div id="screen-write" class="hidden">
    <div class="progress" id="writeProgress"></div>
    <div class="quiz-en" id="writeWord"></div>
    <p class="write-hint" id="writeHint"></p>
    <textarea id="writeInput" rows="2" placeholder="把上面這句中文翻成印尼文..."></textarea>
    <div class="actions" style="margin-top:12px;">
      <button class="primary" id="btnSubmitWrite">送出</button>
      <button class="hidden" type="button" id="writeSpeak">🔊 聽範例句</button>
    </div>
    <div class="write-feedback hidden" id="writeFeedback"></div>
    <div class="actions" style="margin-top:16px;">
      <button class="primary hidden" id="btnNextWrite">下一題</button>
      <button id="btnBackFromWrite">返回清單</button>
    </div>
  </div>

  <!-- ===== 跑步聽力模式畫面 ===== -->
  <div id="screen-listen" class="hidden">
    <div class="progress" id="listenVoiceIndicator" style="font-weight:600;"></div>
    <div class="progress" id="listenProgress"></div>
    <div class="quiz-en" id="listenWord"></div>
    <p class="write-hint" id="listenZh"></p>
    <audio id="listenAudio"></audio>
    <div class="actions" style="margin-top:24px; justify-content:center;">
      <button id="btnBackFromListen">停止並返回清單</button>
    </div>
  </div>

  <!-- ===== 結算畫面 ===== -->
  <div id="screen-result" class="hidden">
    <div class="score" id="resultScore"></div>
    <div class="missed" id="resultMissed"></div>
    <div class="actions" style="margin-top:16px;">
      <button class="primary" id="btnRetryMissed">重測錯誤題目</button>
      <button id="btnBackFromResult">返回清單</button>
    </div>
  </div>
</div>

<script>
// ================= 語言切換 =================
// 印尼文維持完全不加後綴的舊 key（跟 index.html 共用同一份資料，不用搬家）。
// 其他語言（泰文、越南文...）所有 localStorage key 都加 "_語言代碼" 後綴，
// 各語言的單字表/已學會/難度/翻譯快取/例句快取完全分開，互不干擾。切換語言時
// 直接整頁重新載入，避免要手動重置一堆模組層級的變數狀態，風險最低。
const LANG_LS = "flashcard_lang_v1";
const LANG_ORDER = ["id", "th", "vi", "ja", "ko"];
let currentLang = LANG_ORDER.includes(localStorage.getItem(LANG_LS)) ? localStorage.getItem(LANG_LS) : "id";
function lsKey(base){ return lsKeyForLang(base, currentLang); }
function lsKeyForLang(base, lang){ return lang === "id" ? base : `${base}_${lang}`; }

// 越南文南北口音發音差很多，這個是唯一需要在語言之外再多一層選項的地方。
const VI_DIALECT_LS = "flashcard_vi_dialect_v1";
let viDialect = localStorage.getItem(VI_DIALECT_LS) === "bac" ? "bac" : "nam"; // 預設南部（胡志明市）

const LANG_INFO = {
  id: {
    label: "印尼文", flag: "🇮🇩", teacher: "印尼語老師",
    speechLang: "id-ID",
    ttsInstructions: "Speak in authentic Bahasa Indonesia with natural Indonesian pronunciation and intonation, as a native Indonesian speaker would.",
    hasScript: false // 印尼文本身就是拉丁字母，顯示文字就可以直接拿去發音
  },
  th: {
    label: "泰文（羅馬拼音）", flag: "🇹🇭", teacher: "泰語老師",
    speechLang: "th-TH",
    ttsInstructions: "Speak in authentic Thai with natural Thai pronunciation, intonation, and tones, as a native Thai speaker would.",
    hasScript: true // 顯示的是羅馬拼音，真正要發音必須用 AI 額外生成的原生文字（nativeScript）
  },
  vi: {
    label: "越南文（羅馬拼音）", flag: "🇻🇳", teacher: "越南語老師",
    speechLang: "vi-VN",
    get ttsInstructions(){
      return viDialect === "bac"
        ? "Speak in authentic Northern Vietnamese (Hanoi dialect) with natural pronunciation, intonation, and tones, as a native Northern Vietnamese speaker would."
        : "Speak in authentic Southern Vietnamese (Ho Chi Minh City / Saigon dialect) with natural pronunciation, intonation, and tones, as a native Southern Vietnamese speaker would.";
    },
    hasScript: true
  },
  ja: {
    label: "日文（羅馬拼音）", flag: "🇯🇵", teacher: "日語老師",
    speechLang: "ja-JP",
    ttsInstructions: "Speak in authentic Japanese with natural pronunciation, intonation, and pitch accent, as a native Japanese speaker would.",
    hasScript: true
  },
  ko: {
    label: "韓文（羅馬拼音）", flag: "🇰🇷", teacher: "韓語老師",
    speechLang: "ko-KR",
    ttsInstructions: "Speak in authentic Korean with natural pronunciation and intonation, as a native Korean speaker would.",
    hasScript: true
  }
};
function L(){ return LANG_INFO[currentLang]; } // 目前語言的設定物件（跟 speakAsync(text, lang) 的參數 lang 是兩回事，故意取不同名字避免混淆）

// 有些語言的代名詞/語氣詞會依說話者（有時候還要看對方）的性別、年齡而不同，
// 所有會生成該語言句子的 AI 提示都要附上對應的設定，確保生成的版本符合使用者
// 實際的身分，不會生成不適用的性別/稱謂版本。
function genderNoteForLang(){
  if(currentLang === "th"){
    // 泰文語氣詞 ครับ/ค่ะ、第一人稱代名詞 ผม/ฉัน・ดิฉัน 依說話者性別而定，使用者是男性。
    return "\n\n使用者（說話者）是男性，句子裡任何需要區分性別的語氣詞或代名詞都要用男性版本：語氣詞用「ครับ」不要用「ค่ะ」，第一人稱代名詞用「ผม」不要用「ฉัน」或「ดิฉัน」。";
  }
  if(currentLang === "vi"){
    // 越南文的代名詞是看雙方年齡跟性別決定（類似親屬稱謂），使用者是 45 歲男性，
    // 句子裡預設對話對象是 25 歲女性，這種年齡差下自稱通常用「anh」、稱對方用「em」。
    return "\n\n使用者（說話者）是 45 歲男性，句子裡如果需要用到人稱代名詞，除非情境明顯不適用（例如對象明顯是長輩、小孩、或已經指定其他身分），預設對話對象是 25 歲女性：自稱用「anh」，稱呼對方用「em」，不要用其他年齡/性別組合的代名詞（例如 tôi、chị、cô、ông、bà 之類）。";
  }
  if(currentLang === "ja"){
    // 日文的性別標記沒有泰文/越南文那麼強制（不影響文法正確性），但口語第一人稱
    // 代名詞、語尾語氣還是有陽性/陰性傾向，使用者是男性。
    return "\n\n使用者（說話者）是男性，如果句子自然會用到第一人稱代名詞，優先用「僕」或中性的「私」，避免使用明顯偏女性化的用詞或語尾（例如「わ」結尾、「かしら」等）。";
  }
  // 韓文的說話者性別不會像泰文/越南文那樣改變代名詞或語氣詞的選擇，不需要額外設定。
  return "";
}

function setLang(l){
  if(l === currentLang) return;
  localStorage.setItem(LANG_LS, l);
  location.reload();
}
document.querySelectorAll(".lang-btn").forEach(btn => {
  btn.addEventListener("click", () => setLang(btn.dataset.lang));
});
document.getElementById("viDialect").value = viDialect;
document.getElementById("viDialect").addEventListener("change", (e) => {
  viDialect = e.target.value;
  localStorage.setItem(VI_DIALECT_LS, viDialect);
});
function updateLangButtons(){
  document.querySelectorAll(".lang-btn").forEach(btn => {
    btn.classList.toggle("primary", btn.dataset.lang === currentLang);
  });
  document.getElementById("pageTitle").textContent = `${L().flag} ${L().label} Flash Card`;
  document.title = `${L().label} Flash Card`;

async function speak(text, btn, langOverride){
  // 大部分呼叫都是講「目前語言」的字，但跨語言查詢面板會秀出其他語言的字，
  // 那種情況要傳 langOverride 進來，用那個語言自己的語音設定唸，不能用目前
  // 語言的設定去唸別種語言的文字。
  const info = langOverride ? LANG_INFO[langOverride] : L();
  const voiceSource = document.getElementById("voiceSource").value;
  if(voiceSource === "gpt"){
    const audioEl = document.getElementById("listenAudio");
    // speak() 在很多畫面（單字表、Flash Card...）都會被單獨點擊觸發，不像跑步
    // 模式一開始就先解鎖過 <audio> 元素。這裡在點擊當下、還沒 await 任何非同步
    // 動作之前，先同步播一段無聲音檔解鎖，避免 iOS Safari 因為「播放動作跟使用者
    // 手勢隔了一段非同步等待」而擋掉之後真正的播放。
    audioEl.src = SILENT_AUDIO_DATA_URI;
    audioEl.play().then(() => { audioEl.pause(); audioEl.currentTime = 0; }).catch(() => {});
    if(btn){ btn.disabled = true; btn.classList.add('speaking'); }
    try{
      const blob = await withTimeout(getTTSAudioBlob(text, info.ttsInstructions), 20000, "語音生成逾時（20 秒），可能是網路或瀏覽器卡住");
      await playAudioBlob(blob);
    }catch(e){
      alert("GPT 語音播放失敗：" + e.message);
    }finally{
      if(btn){ btn.disabled = false; btn.classList.remove('speaking'); }
    }
    return;
  }
  if(!('speechSynthesis' in window)){ alert('這個瀏覽器不支援語音播放'); return; }
  speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = info.speechLang;
  utter.rate = 0.85;
  const prefix = info.speechLang.slice(0, 2).toLowerCase();
  const voice = cachedVoices.find(v => v.lang.toLowerCase().startsWith(prefix));
  if(voice) utter.voice = voice;
  if(btn){ btn.disabled = true; btn.classList.add('speaking'); }
  utter.onend = utter.onerror = () => { if(btn){ btn.disabled = false; btn.classList.remove('speaking'); } };
  speechSynthesis.speak(utter);
}

// Promise-based speak for sequencing utterances (跑步聽力模式：電腦內建語音)
function speakAsync(text, lang){
  return new Promise((resolve) => {
    if(!('speechSynthesis' in window) || !text){ resolve(); return; }
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = lang;

// ================= 跑步聽力模式的真實音檔（OpenAI TTS + IndexedDB 快取） =================
// 同一段文字只會呼叫一次 OpenAI API，之後都是從本機快取直接播放，不會重複收費。
const TTS_DB_NAME = "flashcard_tts_cache";
const TTS_STORE_NAME = "audio";
// gpt-4o-mini-tts (not tts-1/tts-1-hd) supports an "instructions" field to steer
// language/accent explicitly, which matters a lot for a non-English language like
// Indonesian - without it the model just guesses from the text and can default
// to an English-accented reading.
const TTS_MODEL = "gpt-4o-mini-tts";
const TTS_INSTRUCTIONS_ZH = "Speak in natural Traditional Chinese (Taiwanese Mandarin) pronunciation and intonation, as a native speaker would.";

function openTTSDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(TTS_DB_NAME, 1);
    req.onupgradeneeded = () => { req.result.createObjectStore(TTS_STORE_NAME); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function getCachedAudio(key){
  const db = await openTTSDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(TTS_STORE_NAME, "readonly");
    const req = tx.objectStore(TTS_STORE_NAME).get(key);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}
async function setCachedAudio(key, blob){
  const db = await openTTSDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(TTS_STORE_NAME, "readwrite");
    tx.objectStore(TTS_STORE_NAME).put(blob, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function fetchTTSAudio(text, instructions){
  const key = getOpenaiKey();
  if(!key) throw new Error("請先輸入並儲存 OpenAI API Key");
  const body = { model: TTS_MODEL, voice: "alloy", input: text };
  if(instructions) body.instructions = instructions;
  const res = await fetch("https://api.openai.com/v1/audio/speech", {
    method: "POST",
    headers: {
      "Authorization": `Bearer ${key}`,
      "Content-Type": "application/json"
    },
    body: JSON.stringify(body)
  });
  if(!res.ok){
    const errText = await res.text();
    throw new Error(`HTTP ${res.status}: ${errText.slice(0, 300)}`);
  }
  return await res.blob();
}

async function getTTSAudioBlob(text, instructions){
  const cacheKey = `${TTS_MODEL}::${instructions || ""}::${text}`;
  // IndexedDB can fail outright on some mobile browsers (e.g. Safari Private
  // Browsing blocks it, sometimes with an unhelpfully blank error message).
  // Caching is just an optimization, so never let a cache failure take down
  // the whole TTS flow - fall back to fetching without caching instead.
  let cached = null;
  try{ cached = await getCachedAudio(cacheKey); }
  catch(e){ console.warn("TTS cache read failed, skipping cache:", e); }
  if(cached) return cached;
  const blob = await fetchTTSAudio(text, instructions);
  try{ await setCachedAudio(cacheKey, blob); }
  catch(e){ console.warn("TTS cache write failed, skipping cache:", e); }
  return blob;
}

// 有些手機瀏覽器（觀察到的案例：iOS Safari）在呼叫 OpenAI API 或存取 IndexedDB 時
// 偶爾會整個卡住、既不成功也不報錯，導致畫面停在「生成語音中」不動。用逾時保護，
// 超過時間就丟出明確的錯誤，至少會跳出訊息，不會無聲無息卡住。
function withTimeout(promise, ms, message){
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error(message)), ms))
  ]);
}

function playAudioBlob(blob){
  return new Promise((resolve, reject) => {
    const audioEl = document.getElementById("listenAudio");
    const url = URL.createObjectURL(blob);
    audioEl.src = url;
    audioEl.onended = () => { URL.revokeObjectURL(url); resolve(); };
    audioEl.onerror = () => { URL.revokeObjectURL(url); reject(new Error("播放失敗")); };
    audioEl.play().catch(reject);
  });
}

// ================= 錄自己的發音，跟 AI/真人發音來回比較 =================
// 不做自動評分（AI 對聲調準不準沒辦法給可靠的分數，見前面討論），單純錄下來
// 存住，讓使用者自己在「🔊 標準發音」跟「🎙️ 我的錄音」之間來回切著聽，用自己
// 的耳朵判斷差在哪。用 key（語言+文字）分開存，跟 TTS 快取是各自獨立的
// IndexedDB store。
const REC_DB_NAME = "flashcard_user_recordings";
const REC_STORE_NAME = "recordings";
function openRecDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(REC_DB_NAME, 1);
    req.onupgradeneeded = () => { req.result.createObjectStore(REC_STORE_NAME); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function getUserRecording(key){
  const db = await openRecDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(REC_STORE_NAME, "readonly");
    const req = tx.objectStore(REC_STORE_NAME).get(key);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}
async function setUserRecording(key, blob){
  const db = await openRecDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(REC_STORE_NAME, "readwrite");
    tx.objectStore(REC_STORE_NAME).put(blob, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
function recKeyFor(text){ return `${currentLang}::${text.toLowerCase()}`; }

let activeRecorder = null;
const MAX_RECORD_MS = 8000; // 保險用的自動停止上限，避免忘記按停止一直錄

function startRecording(text, onDone, onError){
  if(activeRecorder) return;
  navigator.mediaDevices.getUserMedia({ audio: true }).then((stream) => {
    const chunks = [];
    const mimeType = (typeof MediaRecorder !== "undefined" && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported("audio/webm"))
      ? "audio/webm" : "";
    const recorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
    activeRecorder = recorder;
    recorder.ondataavailable = (e) => { if(e.data.size > 0) chunks.push(e.data); };
    recorder.onstop = async () => {
      stream.getTracks().forEach((t) => t.stop());
      activeRecorder = null;
      try{
        const blob = new Blob(chunks, { type: recorder.mimeType || "audio/webm" });
        await setUserRecording(recKeyFor(text), blob);
        onDone();
      }catch(e){
        onError(e);
      }
    };
    recorder.start();
    setTimeout(() => { if(activeRecorder === recorder) recorder.stop(); }, MAX_RECORD_MS);
  }).catch((e) => {
    activeRecorder = null;
    onError(e);
  });
}
function stopRecording(){
  if(activeRecorder && activeRecorder.state !== "inactive") activeRecorder.stop();
}

// 中文意思是否完全一樣。這是盡力而為，用詞不同就配不到，不保證每個字都找得到。
function getCrossLangMatches(zhMeaning){
  if(!zhMeaning) return [];
  const results = [];
  LANG_ORDER.forEach((lang) => {
    if(lang === currentLang) return;
    try{
      const wordsRaw = localStorage.getItem(lsKeyForLang(LS_KEY, lang));
      if(!wordsRaw) return;
      const words = JSON.parse(wordsRaw);
      let customOther = {};
      try{ customOther = JSON.parse(localStorage.getItem(lsKeyForLang(CUSTOM_DB_LS, lang))) || {}; }catch(e){}
      const builtIn = lang === "id" ? WORD_DB : EMPTY_DB;
      const match = words.find((w) => {
        const data = customOther[w.text] || builtIn[w.text];
        return data && data.zh === zhMeaning;
      });
      if(match){
        const data = customOther[match.text] || builtIn[match.text];
        results.push({ lang, text: match.text, nativeScript: data.nativeScript || null });
      }
    }catch(e){ /* 那個語言的資料格式壞掉就跳過，不影響其他語言 */ }
  });
  return results;
}

function chunkArr(arr, size){
  const out = [];
  for(let i = 0; i < arr.length; i += size) out.push(arr.slice(i, i + size));
  return out;
}

async function generateWordData(words){
  const hasScript = L().hasScript;
  // hasScript 語言（泰文、越南文）用 nativeScript（真正原生文字，給語音朗讀用）
  // 取代印尼文的 pron（KBBI 標音）欄位——這些語言顯示的本來就是羅馬拼音，不需要
  // 另外標音，但需要真正的原生文字才能唸對。
  const schema = {
    type: "object",
    properties: {
      entries: {
        type: "array",
        items: {
          type: "object",
          properties: Object.assign(
            { zh: { type: "string" }, en: { type: "string" } },
            hasScript ? { nativeScript: { type: "string" } } : { pron: { type: "string" } },
            {
              quizEn: { type: "string" },
              correct: { type: "string" },
              distractors: { type: "array", items: { type: "string" } }
            }
          ),
          required: hasScript
            ? ["zh", "en", "nativeScript", "quizEn", "correct", "distractors"]
            : ["zh", "en", "pron", "quizEn", "correct", "distractors"],
          additionalProperties: false
        }
      }
    },
    required: ["entries"],
    additionalProperties: false
  };
  const list = words.map((w, i) => `${i + 1}. ${w}`).join("\n");
  const prompt = hasScript ? `你是${L().teacher}，正在幫一位母語為中文的學生製作 Flash Card 和測驗題。學生不想學${L().label}的原生文字，下面每一項是他自己用英文字母寫下的${L().label}羅馬拼音（拼法可能不標準、不一致，請你自行判斷他實際想表達的是什麼）。針對每一項依序提供：
- zh：繁體中文意思
- en：英文意思

async function callClaude(prompt, schema, maxTokens){
  const key = getApiKey();
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "content-type": "application/json",
      "x-api-key": key,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify({
      model: "claude-opus-4-8",
      max_tokens: maxTokens,
      output_config: { format: { type: "json_schema", schema } },
      messages: [{ role: "user", content: prompt }]
    })
  });
  if(!res.ok){
    const errBody = await res.text();
    throw new Error(`HTTP ${res.status}: ${errBody.slice(0, 300)}`);
  }
  const responseData = await res.json();
  if(responseData.stop_reason === "refusal"){
    throw new Error("Claude 拒絕回應這個請求");
  }
  const textBlock = (responseData.content || []).find(b => b.type === "text");
  if(!textBlock){
    throw new Error("沒有收到文字回應");
  }
  return JSON.parse(textBlock.text);
}

function addWordToList(text){
  const clean = text.trim();
  if(!clean) return false;
  if(allWords.some(w => w.text.toLowerCase() === clean.toLowerCase())) return false;
  const nextId = allWords.length ? Math.max(...allWords.map(w => w.id)) + 1 : 1;
  // source 標記這個字是從例句加的、還沒進到 Obsidian 那邊的主清單，
  // 下次從 Obsidian 匯入（整批取代）時要特別保留，避免被沖掉。
  const newWord = { id: nextId, text: clean, source: "sentence" };
  allWords.push(newWord);
  saveWordList(allWords);
  selected.add(nextId);
  saveSelected();
  // 不呼叫 renderList()——這個函式常常是在展開中的用法面板裡被觸發，整個重繪
  // 列表會把使用者正在看的面板收合掉。改成只把這一個新單字插到清單最前面，
  // 這樣立刻看得到剛加的字，其他正在展開的面板不受影響。
  if(getVisibleWords().some(w => w.id === nextId)){
    const el = document.getElementById("wordList");
    const emptyMsg = el.querySelector(".empty-msg");
    if(emptyMsg) emptyMsg.remove();
    const { row, usagePanel, crossLangPanel } = createWordItem(newWord);
    el.insertBefore(crossLangPanel, el.firstChild);
    el.insertBefore(usagePanel, crossLangPanel);
    el.insertBefore(row, usagePanel);
  }
  updateCount();
  updatePendingSyncBar();
  return true;
}

// 把例句拆成一個個可點的字，點了就把那個字加進單字表——保留原本的空白/標點原樣顯示，
// 只有比對「已加入」跟真正要加入清單時才用去掉頭尾標點後的乾淨版本。
function isWordInList(clean){
  return allWords.some(w => w.text.toLowerCase() === clean.toLowerCase());
}
function renderTappableSentence(sentence){
  const wrap = document.createElement("span");
  const tokens = sentence.split(/(\s+)/);
  tokens.forEach(tok => {
    if(tok === "" || /^\s+$/.test(tok)){
      wrap.appendChild(document.createTextNode(tok));
      return;
    }
    const clean = tok.replace(/^[^A-Za-z]+|[^A-Za-z]+$/g, "");
    if(!clean){
      wrap.appendChild(document.createTextNode(tok));
      return;
    }
    const wSpan = document.createElement("span");
    wSpan.className = "usage-word" + (isWordInList(clean) ? " in-list" : "");
    wSpan.textContent = tok;
    wSpan.title = isWordInList(clean) ? "已在單字表裡" : "點一下加入單字表";
    wSpan.addEventListener("click", (e) => {
      e.preventDefault(); e.stopPropagation();
      if(wSpan.classList.contains("in-list")) return;
      if(addWordToList(clean)) wSpan.classList.add("in-list");
    });
    wrap.appendChild(wSpan);
  });
  return wrap;
}

function getVisibleWords(){
  const query = document.getElementById("wordSearch").value.trim().toLowerCase();
  const diffFilter = document.getElementById("difficultyFilter").value;
  const list = allWords.filter(w => {
    if(showSelectedOnly && !selected.has(w.id)) return false;
    if(diffFilter){
      const d = getDifficulty(w.text);
      if(diffFilter === "none" ? d !== null : d !== diffFilter) return false;
    }
    if(!query) return true;
    const data = lookup(w.text);
    const haystack = `${w.text} ${data ? data.zh : ""} ${data ? data.en : ""}`.toLowerCase();
    return haystack.includes(query);
  });
  if(sortAZ) list.sort((a, b) => a.text.localeCompare(b.text, "id"));
  return list;
}

document.getElementById("btnDedupByMeaning").onclick = () => {
  // AI 生成的羅馬拼音沒有唯一標準寫法，同一個字可能被拼成不同字串、變成看起來
  // 不同的重複項目（例如 "sawadee" 跟 "sawatdee"）。這裡改用「中文意思是否
  // 完全一樣」當作判斷同一個字的依據，沒有翻譯資料的字沒辦法判斷、不會被動到。
  const groups = {};
  allWords.forEach(w => {
    const data = lookup(w.text);
    if(!data || !data.zh) return;
    (groups[data.zh] = groups[data.zh] || []).push(w);
  });
  const toRemove = new Set();
  let groupCount = 0;
  Object.values(groups).forEach(group => {
    if(group.length <= 1) return;
    groupCount++;
    group.sort((a, b) => a.id - b.id);
    group.slice(1).forEach(w => toRemove.add(w.id));
  });
  if(toRemove.size === 0){ alert("沒有找到中文意思重複的字。"); return; }
  if(!confirm(`找到 ${groupCount} 組意思重複的字，總共會刪掉 ${toRemove.size} 個（每組留意思相同裡 id 最小的那個），這個動作沒辦法復原，確定要合併嗎？`)) return;
  allWords = allWords.filter(w => !toRemove.has(w.id));
  toRemove.forEach(id => {
    selected.delete(id);
    cardMasteredIds.delete(id);
    quizMasteredIds.delete(id);
  });
  saveWordList(allWords);
  saveSelected();
  saveCardMastered();
  saveQuizMastered();
  renderList();
  alert(`已合併，刪掉了 ${toRemove.size} 個重複的字。`);
};

// ---- 匯入 txt/md（自動去除中文意思、注音口訣、Markdown 符號，只留目標語言文字） ----
// 允許的文字腳本依目前的目標語言而定：任何語言的羅馬拼音都是拉丁字母，一律
// 允許；如果使用者匯入的其實是真正的原生文字（不是羅馬拼音），再依語言額外
// 允許該語言自己的原生文字腳本。中文（Han）不算進允許範圍——中文通常是同一行
// 後面貼的意思註解，要被切掉；日文例外，因為漢字本來就是日文的一部分。這樣
// 泰文字母、日文假名漢字、韓文諺文、越南文重音都認得出來，不會像只認拉丁字母
// 的舊規則一樣把使用者打的原生文字整行濾掉。
function scriptsForLang(){
  const scripts = ["Latin"];
  if(currentLang === "th") scripts.push("Thai");
  if(currentLang === "ja") scripts.push("Hiragana", "Katakana", "Han");
  if(currentLang === "ko") scripts.push("Hangul");
  return scripts.map(s => `\\p{Script=${s}}`).join("");
}
function nonWordCharRe(){
  return new RegExp(`[^${scriptsForLang()}0-9\\s.,!?'"‘’“”-]`, "u");
}
function hasWordCharRe(){
  return new RegExp(`[${scriptsForLang()}]`, "u");
}

function extractIndonesianLine(raw){
  let s = raw.replace(/\r/g, "").trim();
  if(s === "") return null;
  if(s.startsWith("[")) return null;        // [🔗 分類標題] 這種區塊標題
  if(/^-{2,}$/.test(s)) return null;        // --- 分隔線
  s = s.replace(/\*\*/g, "");               // 去掉 **粗體**
  s = s.replace(/^\d+[\.\)]\s*/, "");       // 去掉「1. 」「1) 」編號
  s = s.replace(/^[\s\-\*]+/, "");          // 去掉「- 」「* 」項目符號
  const cutMatch = s.match(nonWordCharRe());
  if(cutMatch) s = s.slice(0, cutMatch.index);
  s = s.replace(/\s+/g, " ");
  s = s.replace(/[\s:\/=,\-]+$/, "").replace(/^[\s:\/=,\-]+/, "");
  s = s.trim();
  if(s === "") return null;
  if(!hasWordCharRe().test(s)) return null; // 沒有目標語言的文字就跳過
  return s;
}

document.getElementById("btnImport").onclick = () => document.getElementById("fileInput").click();
document.getElementById("fileInput").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const lines = ev.target.result.split(/\r?\n/);
    const parsed = [];
    const seen = new Set();
    let autoId = 0;
    lines.forEach(line => {
      const cleaned = extractIndonesianLine(line);
      if(cleaned === null) return;
      const key = cleaned.toLowerCase();
      if(seen.has(key)) return;
      seen.add(key);
      autoId++;
      parsed.push({ id: autoId, text: cleaned });
    });
    if(parsed.length === 0){
      alert(`沒有解析到任何${L().label}單字，請確認檔案內容。`);
      return;
    }
    // 從例句加的字（source: "sentence"）只存在 App 本機、還沒被加進 Obsidian，
    // 如果這次匯入的內容裡沒有它們，就自動保留下來，不要被整批取代沖掉。
    // 一旦哪次匯入內容裡真的出現同一個字了（代表你已手動加回 Obsidian），
    // 就會走一般匯入路徑、不再帶 source 標記，自動視為「已同步」。
    const pendingSentenceWords = allWords.filter(w => w.source === "sentence" && !seen.has(w.text.toLowerCase()));
    let nextId = parsed.length;
    pendingSentenceWords.forEach(w => {
      nextId++;
      parsed.push({ id: nextId, text: w.text, source: "sentence" });
    });
    allWords = parsed;
    saveWordList(allWords);
    selected = new Set(allWords.map(w => w.id));
    saveSelected();
    cardMasteredIds = new Set();
    quizMasteredIds = new Set();
    saveCardMastered();
    saveQuizMastered();
    renderList();
    const pendingNote = pendingSentenceWords.length
      ? `（其中 ${pendingSentenceWords.length} 個是之前從例句加的、還沒同步進 Obsidian，已自動保留）`
      : "";
    alert(`已匯入 ${parsed.length} 個項目。${pendingNote}`);
  };
  reader.readAsText(file, "UTF-8");
});

document.getElementById("fileInputConvertTh").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (ev) => {
    const lines = ev.target.result.split(/\r?\n/);
    const indoWords = [];
    const seen = new Set();
    lines.forEach(line => {
      const cleaned = extractIndonesianLine(line);
      if(cleaned === null) return;
      const key = cleaned.toLowerCase();
      if(seen.has(key)) return;
      seen.add(key);
      indoWords.push(cleaned);
    });
    if(indoWords.length === 0){
      alert("沒有解析到任何單字，請確認檔案內容。");
      return;
    }
    // 如果之前不小心用「一般匯入」把這些印尼文原字直接加進了泰文清單，
    // 這裡先把那些殘留的印尼文原字清掉，改用轉換後的泰文版本取代，
    // 避免印尼文原字跟轉換後的泰文版本兩份都留著。
    const indoWordSet = new Set(indoWords.map(w => w.toLowerCase()));
    const staleCount = allWords.filter(w => indoWordSet.has(w.text.toLowerCase())).length;
    if(staleCount > 0){
      allWords = allWords.filter(w => !indoWordSet.has(w.text.toLowerCase()));
    }
    // 只轉「還沒轉過」或「轉過但對應的字後來不見了（被刪掉/合併掉/當初其實
    // 沒轉成功）」的來源字，已經轉過而且結果還在清單裡的完全不會被動到，
    // 不用整批重轉、也不會因為 AI 拼法飄移產生新的重複。
    const wordsToConvert = indoWords.filter(w => {
      const mapped = convertedMap[w.toLowerCase()];
      if(!mapped) return true;
      return !allWords.some(x => x.text.toLowerCase() === mapped.toLowerCase());
    });
    const alreadyDoneCount = indoWords.length - wordsToConvert.length;
    if(wordsToConvert.length === 0){
      alert(`這 ${indoWords.length} 個字之前都已經轉換過了，沒有新的需要轉換。`);
      return;
    }
    const btn = document.getElementById("btnImportConvertTh");
    const originalLabel = btn.textContent;
    btn.disabled = true;
    const batches = chunkArr(wordsToConvert, 8);
    let done = 0;
    let addedCount = 0;
    let unmatchedCount = 0;
    try{
      // 一批（8個）轉完就馬上加進清單、重繪畫面，不用等整份檔案轉完才看到字，
      // 跟原本「AI 自動生成翻譯」那個功能的做法一致。
      for(const batch of batches){
        btn.textContent = `轉換中... (${done}/${wordsToConvert.length})`;
        const entries = await convertWordsToTargetLang(batch);
        let nextId = allWords.length ? Math.max(...allWords.map(w => w.id)) : 0;
        // 只有真的有比對到來源字、而且產出有效羅馬拼音的，才記錄為「已轉換」。
        // AI 有時候會少回傳幾筆或漏掉某一項，如果整批照樣全部標記已轉換，
        // 沒轉到的字就會被誤判成「以後都跳過」、永遠補不回來（就是這次回報的問題）。
        const batchWordSet = new Set(batch.map(w => w.toLowerCase()));
        const matchedThisBatch = new Set();
        entries.forEach(entry => {
          const text = (entry.romanized || "").trim();
          const sourceKey = (entry.source || "").trim().toLowerCase();
          if(!text || !sourceKey || !batchWordSet.has(sourceKey)) return;
          matchedThisBatch.add(sourceKey);
          // 不管這個字是新加的還是本來就存在（同字重複），都記住這個原字對應
          // 到哪個結果字，下次匯入才有辦法確認「這個結果字是不是還在」。
          convertedMap[sourceKey] = text;
          if(allWords.some(w => w.text.toLowerCase() === text.toLowerCase())) return;
          nextId++;
          allWords.push({ id: nextId, text });
          customDB[text] = {
            zh: entry.zh, en: entry.en, nativeScript: entry.nativeScript,
            quizEn: entry.quizEn, correct: entry.correct, distractors: entry.distractors
          };
          addedCount++;
        });
        unmatchedCount += batch.length - matchedThisBatch.size;
        saveConvertedMap();
        saveWordList(allWords);
        saveCustomDB();
        selected = new Set(allWords.map(w => w.id));
        saveSelected();
        done += batch.length;
        renderList();
      }
    }catch(err){
      btn.disabled = false;
      btn.textContent = originalLabel;
      alert(`轉換到一半失敗：${err.message}\n\n已經轉好、加進清單的 ${addedCount} 個不會不見，也已經記住轉過了。可以重新選同一個檔案再匯入一次，只會補剩下沒轉到的。`);
      return;
    }
    btn.disabled = false;
    btn.textContent = originalLabel;
    const staleNote = staleCount > 0 ? `，並清掉 ${staleCount} 個殘留的原文字` : "";
    const skipNote = alreadyDoneCount > 0 ? `${alreadyDoneCount} 個之前轉換過已跳過，` : "";
    const unmatchedNote = unmatchedCount > 0 ? `\n\n有 ${unmatchedCount} 個字這次沒有成功對應到結果，還沒被標記為已轉換，重新匯入同一個檔案時會自動再試一次。` : "";
    alert(`轉換了 ${wordsToConvert.length} 個新單字，${skipNote}新增了 ${addedCount} 個${L().label}單字${staleNote}。${unmatchedNote}`);
  };
  reader.readAsText(file, "UTF-8");
});

// ================= Flash Card =================
let cardSession = [];
let cardIndex = 0;

const CARD_DIRECTION_LS = "flashcard_direction_v1";
let cardDirection = localStorage.getItem(lsKey(CARD_DIRECTION_LS)) === "zh-id" ? "zh-id" : "id-zh";

function updateCardDirectionLabel(){
  document.getElementById("btnCardDirection").textContent = cardDirection === "id-zh"
    ? `🔄 正面：${L().label} → 背面：中文`
    : `🔄 正面：中文 → 背面：${L().label}`;
}
updateCardDirectionLabel();
document.getElementById("btnCardDirection").addEventListener("click", () => {
  cardDirection = cardDirection === "id-zh" ? "zh-id" : "id-zh";
  localStorage.setItem(lsKey(CARD_DIRECTION_LS), cardDirection);
  updateCardDirectionLabel();
  if(cardSession.length) renderCard();
});

document.getElementById("btnStartCards").onclick = () => {
  const list = allWords.filter(w => selected.has(w.id) && !cardMasteredIds.has(w.id));
  if(list.length === 0){ alert("請至少選一個尚未在 Flash Card 標記已學會的單字"); return; }
  cardSession = shuffleArr(list.slice());
  cardIndex = 0;
  showScreen("cards");
  renderCard();
};

function renderCard(){
  const w = cardSession[cardIndex];
  const data = lookup(w.text);
  document.getElementById("cardProgress").textContent = `第 ${cardIndex+1} / ${cardSession.length} 張`;
  const pronText = (data && data.pron && data.pron !== w.text) ? ` [${data.pron}]` : "";
  if(cardDirection === "id-zh"){
    document.getElementById("cardFront").textContent = w.text;
    document.getElementById("cardPron").textContent = pronText.trim();
    document.getElementById("cardBack").textContent = data ? `${data.zh}（${data.en}）` : "尚無翻譯資料";
  } else {
    document.getElementById("cardFront").textContent = data ? data.zh : "尚無翻譯資料";
    document.getElementById("cardPron").textContent = "";
    document.getElementById("cardBack").textContent = w.text + pronText;
  }
  document.getElementById("cardBack").classList.add("hidden");
  document.getElementById("cardAssessRow").classList.add("hidden");
}
document.getElementById("cardArea").onclick = () => {
  document.getElementById("cardBack").classList.toggle("hidden");
  document.getElementById("cardAssessRow").classList.toggle("hidden");
};
document.getElementById("cardSpeak").addEventListener("click", (e) => {
  e.stopPropagation();
  speak(getSpeechText(cardSession[cardIndex]), e.currentTarget);
});
document.getElementById("btnPrev").onclick = () => {
  cardIndex = (cardIndex - 1 + cardSession.length) % cardSession.length;
  renderCard();
};
document.getElementById("btnNext").onclick = () => {
  cardIndex = (cardIndex + 1) % cardSession.length;
  renderCard();
};
document.getElementById("btnShuffleCards").onclick = () => {
  cardSession = shuffleArr(cardSession);
  cardIndex = 0;
  renderCard();
};
document.getElementById("btnBackFromCards").onclick = () => showScreen("select");

function goToNextCard(){
  cardIndex = (cardIndex + 1) % cardSession.length;
  renderCard();
}
document.getElementById("btnCardWrong").onclick = () => {
  goToNextCard();
};
document.getElementById("btnCardRight").onclick = () => {
  const w = cardSession[cardIndex];
  cardMasteredIds.add(w.id);
  saveCardMastered();
  cardSession.splice(cardIndex, 1);
  if(cardSession.length === 0){
    alert("這批單字都已經標記學會了！");

// ================= 測驗 =================
let quizSession = [];
let quizIndex = 0;
let quizScore = 0;
let quizMissed = [];
let quizRetryPool = null;

document.getElementById("btnStartQuiz").onclick = () => {
  const list = allWords.filter(w => selected.has(w.id) && !quizMasteredIds.has(w.id));
  const ready = list.filter(w => lookup(w.text) && lookup(w.text).correct);
  const skipped = list.length - ready.length;
  if(ready.length === 0){ alert("勾選的單字都還沒有測驗例句，或都已經在測驗標記學會了，請調整清單。"); return; }
  if(skipped > 0){
    alert(`有 ${skipped} 個單字尚無測驗例句，已略過。`);
  }
  quizSession = shuffleArr(ready.slice());
  quizIndex = 0;
  quizScore = 0;
  quizMissed = [];
  showScreen("quiz");
  renderQuestion();
};

function renderQuestion(){
  const w = quizSession[quizIndex];
  const data = lookup(w.text);
  document.getElementById("quizProgress").textContent = `第 ${quizIndex+1} / ${quizSession.length} 題`;
  document.getElementById("quizEnText").textContent = data.quizEn;
  const options = shuffleArr([data.correct, ...data.distractors]);
  const optEl = document.getElementById("quizOptions");
  optEl.innerHTML = "";
  document.getElementById("btnNextQuestion").classList.add("hidden");
  document.getElementById("btnMastered").classList.add("hidden");
  options.forEach(opt => {
    const row = document.createElement("div");
    row.className = "opt-row";
    const b = document.createElement("button");
    b.className = "opt";
    b.textContent = opt;
    b.onclick = () => answerQuestion(b, opt, data.correct, w);
    row.appendChild(b);
    // 泰文模式下這些測驗選項只有羅馬拼音、沒有對應的真泰文字，硬要唸羅馬拼音
    // 容易唸錯誤導學生，乾脆不放發音按鈕，比唸錯還誠實。
    if(!L().hasScript){
      const speakBtn = document.createElement("button");
      speakBtn.type = "button";
      speakBtn.className = "opt-speak";
      speakBtn.textContent = "🔊";
      speakBtn.setAttribute("aria-label", `播放「${opt}」發音`);
      speakBtn.addEventListener("click", (e) => { e.stopPropagation(); speak(opt, speakBtn); });
      row.appendChild(speakBtn);
    }
    optEl.appendChild(row);
  });
}
function answerQuestion(btn, chosen, correct, word){
  const buttons = document.querySelectorAll("#quizOptions .opt");
  buttons.forEach(b => b.disabled = true);
  if(chosen === correct){
    btn.classList.add("correct");
    quizScore++;
    if(!quizMasteredIds.has(word.id)){
      document.getElementById("btnMastered").classList.remove("hidden");
    }
  }else{
    btn.classList.add("wrong");
    buttons.forEach(b => { if(b.textContent === correct) b.classList.add("correct"); });
    quizMissed.push(word);
  }
  document.getElementById("btnNextQuestion").classList.remove("hidden");
}
function goToNextQuestion(){
  quizIndex++;
  if(quizIndex >= quizSession.length){
    showResult();
  }else{
    renderQuestion();
  }
}
document.getElementById("btnNextQuestion").onclick = goToNextQuestion;
document.getElementById("btnMastered").onclick = () => {
  const w = quizSession[quizIndex];
  quizMasteredIds.add(w.id);
  saveQuizMastered();
  goToNextQuestion();
};
document.getElementById("btnBackFromQuiz").onclick = () => showScreen("select");

// ================= 中翻印尼文（AI 出句、AI 批改） =================
let writeSession = [];
let writeIndex = 0;
let writeScore = 0;
let writeGrading = false;

document.getElementById("btnStartWrite").onclick = async () => {
  if(!getApiKey()){ alert("這個模式需要用 AI 出題跟批改，請先在上面輸入並儲存 API Key。"); return; }
  const list = allWords.filter(w => selected.has(w.id));
  const ready = list.filter(w => lookup(w.text));
  const skipped = list.length - ready.length;
  if(ready.length === 0){ alert("勾選的單字都還沒有翻譯資料，請先選有翻譯資料的單字，或用「AI 自動生成」補上。"); return; }
  if(skipped > 0){
    alert(`有 ${skipped} 個單字尚無翻譯資料，已略過。`);
  }
  const startBtn = document.getElementById("btnStartWrite");
  startBtn.disabled = true;
  const batches = chunkArr(ready, 12);
  const sentences = [];
  try{
    for(let i = 0; i < batches.length; i++){
      startBtn.textContent = `AI 出題中... (${i + 1}/${batches.length})`;
      const batchSentences = await generateWriteSentences(batches[i]);
      sentences.push(...batchSentences);
    }
  }catch(e){
    startBtn.disabled = false;
    startBtn.textContent = writeBtnLabel();
    alert("出題失敗：" + e.message);
    return;
  }
  startBtn.disabled = false;
  startBtn.textContent = "✍️ 中翻印尼文（AI 出句、AI 批改）";
  if(sentences.length === 0){ alert("沒有產生出任何句子，請再試一次。"); return; }
  writeSession = shuffleArr(sentences);
  writeIndex = 0;
  writeScore = 0;
  showScreen("write");
  renderWriteQuestion();
};

function renderWriteQuestion(){
  const s = writeSession[writeIndex];
  document.getElementById("writeProgress").textContent = `第 ${writeIndex + 1} / ${writeSession.length} 題`;
  document.getElementById("writeWord").textContent = s.zh;
  document.getElementById("writeHint").textContent = s.usedWords && s.usedWords.length ? `可用單字參考：${s.usedWords.join("、")}` : "";
  const input = document.getElementById("writeInput");
  input.value = "";
  input.disabled = false;
  input.classList.remove("hidden");
  const submitBtn = document.getElementById("btnSubmitWrite");
  submitBtn.classList.remove("hidden");
  submitBtn.disabled = false;
  submitBtn.textContent = "送出";
  document.getElementById("writeSpeak").classList.add("hidden");
  document.getElementById("writeFeedback").classList.add("hidden");
  document.getElementById("writeFeedback").innerHTML = "";
  document.getElementById("btnNextWrite").classList.add("hidden");
  input.focus();
}

document.getElementById("btnSubmitWrite").addEventListener("click", async () => {
  if(writeGrading) return;
  const input = document.getElementById("writeInput");
  const answer = input.value.trim();
  if(!answer){ alert("請先輸入句子"); return; }
  const s = writeSession[writeIndex];
  const submitBtn = document.getElementById("btnSubmitWrite");
  writeGrading = true;
  submitBtn.disabled = true;
  submitBtn.textContent = "批改中...";
  try{
    const result = await gradeTranslation(s.zh, s.usedWords || [], answer);
    writeGrading = false;
    input.disabled = true;
    submitBtn.classList.add("hidden");
    if(result.correct) writeScore++;
    const fb = document.getElementById("writeFeedback");
    fb.classList.remove("hidden");
    fb.innerHTML = `
      <p class="verdict ${result.correct ? "ok" : "no"}">${result.correct ? "✓ 不錯！" : "還需要調整"}</p>
      <p>${result.feedback}</p>
      ${result.wordsUsedCorrectly && result.wordsUsedCorrectly.length ? `<p>有正確用到：${result.wordsUsedCorrectly.join("、")}</p>` : ""}
      <p class="ref">參考翻譯：${result.betterSentence}</p>
    `;
    const speakBtn = document.getElementById("writeSpeak");
    // 泰文模式沒有這句參考翻譯對應的真泰文字，唸羅馬拼音容易誤導，就不顯示按鈕。
    if(!L().hasScript){
      speakBtn.classList.remove("hidden");
      speakBtn.onclick = () => speak(result.betterSentence, speakBtn);
    }
    document.getElementById("btnNextWrite").classList.remove("hidden");
  }catch(e){
    writeGrading = false;
    submitBtn.disabled = false;
    submitBtn.textContent = "送出";
    alert("批改失敗：" + e.message);
  }
});

document.getElementById("btnNextWrite").onclick = () => {
  writeIndex++;
  if(writeIndex >= writeSession.length){
    finishWriteSession();
  }else{
    renderWriteQuestion();
  }
};
document.getElementById("btnBackFromWrite").onclick = () => showScreen("select");

function finishWriteSession(){
  document.getElementById("writeProgress").textContent = "完成";
  document.getElementById("writeWord").textContent = `你答對了 ${writeScore} / ${writeSession.length} 題`;
  document.getElementById("writeHint").textContent = "";
  document.getElementById("writeInput").classList.add("hidden");
  document.getElementById("btnSubmitWrite").classList.add("hidden");
  document.getElementById("writeSpeak").classList.add("hidden");
  document.getElementById("writeFeedback").classList.add("hidden");
  document.getElementById("btnNextWrite").classList.add("hidden");
}

// ================= 跑步聽力模式（唸印尼文x3 + 中文x1，一直循環） =================
let listenSession = [];
let listenIndex = 0;
let listenRunning = false;
let listenTimeoutId = null;

// 0.3 秒的真實無聲 WAV（8-bit/8kHz），用來在使用者點擊當下「解鎖」<audio> 元素。
// 手機瀏覽器（尤其 iOS Safari）要求播放動作緊接著使用者手勢才會放行；跑步模式的
// 真正語音要等 TTS API 回來才能播，中間的等待會讓瀏覽器認定這次播放跟點擊無關而
// 擋掉。0 長度的音檔在 iOS 上可能來不及真的播放、解鎖不會生效，所以改用有實際
// 長度、確定會觸發播放的無聲檔案。
const SILENT_AUDIO_DATA_URI = "data:audio/wav;base64,UklGRoQJAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YWAJAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgIA=";

document.getElementById("btnStartListen").onclick = () => {
  const list = allWords.filter(w => selected.has(w.id) && lookup(w.text));
  if(list.length === 0){ alert("請先選有翻譯資料的單字"); return; }
  listenSession = shuffleArr(list.slice());
  listenIndex = 0;
  listenRunning = true;
  showScreen("listen");
  const voiceSource = document.getElementById("voiceSource").value;
  document.getElementById("listenVoiceIndicator").textContent = voiceSource === "gpt" ? "🔊 使用中：GPT 語音" : "🔊 使用中：電腦內建語音";
  const audioEl = document.getElementById("listenAudio");
  audioEl.src = SILENT_AUDIO_DATA_URI;
  audioEl.play().then(() => { audioEl.pause(); audioEl.currentTime = 0; }).catch(() => {});
  runListenLoop();
};

async function runListenLoop(){
  const thinkMs = Math.max(500, (Number(document.getElementById("thinkPause").value) || 3) * 1000);
  const voiceSource = document.getElementById("voiceSource").value;
  while(listenRunning){
    const w = listenSession[listenIndex];
    const data = lookup(w.text);
    document.getElementById("listenProgress").textContent = `第 ${listenIndex + 1} / ${listenSession.length} 個（一直循環）`;
    document.getElementById("listenWord").textContent = w.text;
    document.getElementById("listenZh").textContent = "";

    try{
      if(voiceSource === "gpt"){
        document.getElementById("listenProgress").textContent = `第 ${listenIndex + 1} / ${listenSession.length} 個（生成語音中...）`;
        const idBlob = await withTimeout(getTTSAudioBlob(getSpeechText(w), L().ttsInstructions), 20000, "語音生成逾時（20 秒），可能是網路或瀏覽器卡住");
        const zhBlob = await withTimeout(getTTSAudioBlob(data.zh, TTS_INSTRUCTIONS_ZH), 20000, "語音生成逾時（20 秒），可能是網路或瀏覽器卡住");
        document.getElementById("listenProgress").textContent = `第 ${listenIndex + 1} / ${listenSession.length} 個（一直循環）`;

        for(let i = 0; i < 3 && listenRunning; i++){
          await playAudioBlob(idBlob);
          if(!listenRunning) break;
          await waitMs(400);
        }
        if(!listenRunning) break;

        await waitMs(thinkMs);
        if(!listenRunning) break;

        document.getElementById("listenZh").textContent = data.zh;
        await playAudioBlob(zhBlob);
      } else {
        for(let i = 0; i < 3 && listenRunning; i++){
          await speakAsync(getSpeechText(w), L().speechLang);
          if(!listenRunning) break;
          await waitMs(400);
        }
        if(!listenRunning) break;

        await waitMs(thinkMs);
        if(!listenRunning) break;

        document.getElementById("listenZh").textContent = data.zh;
        await speakAsync(data.zh, "zh-TW");
      }
    }catch(e){
      // 錯誤同時寫進畫面文字，不要只靠 alert()——Safari 在同一頁密集跳出多次
      // alert 之後可能會被使用者或系統靜音掉，之後的 alert() 呼叫會完全沒反應。
      // 有些錯誤（例如某些 DOMException）message 是空字串，保底顯示 name 或整個物件字串化。
      const errMsg = (e && (e.message || e.name)) || String(e) || "未知錯誤（沒有錯誤訊息）";
      document.getElementById("listenProgress").textContent = "❌ 發生錯誤，已停止";
      document.getElementById("listenWord").textContent = errMsg;
      document.getElementById("listenZh").textContent = "";
      try{ alert("語音播放失敗：" + errMsg); }catch(alertErr){}
      listenRunning = false;
      break;
    }
    if(!listenRunning) break;

    await waitMs(800);
    listenIndex = (listenIndex + 1) % listenSession.length;
  }
}

document.getElementById("btnBackFromListen").onclick = () => {
  listenRunning = false;
  if(listenTimeoutId) clearTimeout(listenTimeoutId);
  document.getElementById("listenAudio").pause();
  showScreen("select");
};

function showResult(){

document.getElementById("btnRetryMissed").onclick = () => {

  quizMissed = [];

document.getElementById("btnBackFromResult").onclick = () => showScreen("select");

// ================= 共用 =================
function shuffleArr(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function showScreen(name){
  ["select","cards","quiz","write","listen","result"].forEach(s => {
    document.getElementById("screen-" + s).classList.toggle("hidden", s !== name);
  });
  if(name === "select") renderList();
}

renderList();
