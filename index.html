<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>印尼語 Flash Card</title>
<script src="words.js"></script>
<style>
  :root{
    --bg:#f5f3ef; --card:#ffffff; --text:#1f1b16; --muted:#7a7368;
    --accent:#c1440e; --accent2:#2f6f4e; --border:#e2ddd3; --danger:#b23a2f;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#181512; --card:#242019; --text:#f2ede4; --muted:#a89e8f;
      --accent:#e07b45; --accent2:#5fae83; --border:#3a342b; --danger:#e0665a;
    }
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,"Segoe UI",Helvetica,Arial,"PingFang TC","Microsoft JhengHei",sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh;
  }
  .wrap{max-width:640px; margin:0 auto; padding:20px 16px 60px;}
  h1{font-size:1.3rem; margin:0 0 4px;}
  .sub{color:var(--muted); font-size:0.85rem; margin-bottom:18px;}
  .toolbar{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;}
  button{
    font-family:inherit; font-size:0.9rem; padding:9px 14px; border-radius:10px;
    border:1px solid var(--border); background:var(--card); color:var(--text); cursor:pointer;
  }
  button:hover{border-color:var(--accent);}
  button.primary{background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600;}
  button.secondary{background:var(--accent2); color:#fff; border-color:var(--accent2); font-weight:600;}
  button:disabled{opacity:0.5; cursor:default;}
  input[type=file]{display:none;}
  input[type=text], input[type=password], input[type=number], textarea{
    font-family:inherit; font-size:0.9rem; padding:9px 12px; border-radius:10px;
    border:1px solid var(--border); background:var(--card); color:var(--text); flex:1; min-width:200px;
  }
  textarea{width:100%; resize:vertical; font-size:1rem;}
  .note{font-size:0.75rem; color:var(--muted); margin:-6px 0 12px;}
  .list{background:var(--card); border:1px solid var(--border); border-radius:14px; overflow:hidden; margin-bottom:16px;}
  .item{display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--border);}
  .item:last-child{border-bottom:none;}
  .item .id-text{font-weight:600;}
  .item .meaning{color:var(--muted); font-size:0.82rem;}
  .item.no-data .id-text{color:var(--muted);}
  .item.no-data .meaning{color:var(--danger);}
  .item > div{flex:1;}
  .speak-btn{flex:0 0 auto; padding:6px 10px; font-size:1rem; border-radius:10px;}
  .speak-btn:disabled{opacity:0.5;}
  .delete-btn{flex:0 0 auto; padding:6px 10px; font-size:1rem; border-radius:10px;}
  .delete-btn:hover{border-color:var(--danger); color:var(--danger);}
  .badge-row{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px;}
  .badge{font-size:0.72rem; padding:3px 8px; border-radius:999px; background:var(--bg); border:1px solid var(--border); color:var(--muted);}
  .badge:hover{border-color:var(--accent); color:var(--accent);}
  .count{font-size:0.85rem; color:var(--muted); margin-bottom:10px;}
  .actions{display:flex; gap:10px; flex-wrap:wrap;}
  .hidden{display:none !important;}

  .card-area{background:var(--card); border:1px solid var(--border); border-radius:18px; padding:32px 20px; text-align:center; min-height:220px; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; user-select:none;}
  .card-area .front{font-size:1.5rem; font-weight:700;}
  .front-pron{font-size:0.95rem; color:var(--muted); margin-top:4px;}
  .item .pron{color:var(--muted); font-weight:400; font-size:0.85rem;}
  .card-area .back{font-size:1.05rem; color:var(--accent2); margin-top:12px;}
  .listen-btn{margin-top:14px; padding:9px 16px; border-radius:999px; font-weight:600;}
  .listen-btn.speaking{opacity:0.6;}
  .progress{text-align:center; color:var(--muted); font-size:0.85rem; margin:10px 0;}
  .nav{display:flex; justify-content:center; gap:10px; margin-top:16px;}

  .quiz-en{font-size:1.15rem; font-weight:600; margin:18px 0; text-align:center;}
  .opt-row{display:flex; gap:8px; margin-bottom:10px;}
  .opt{display:block; width:100%; text-align:left; padding:12px 14px; border-radius:12px; flex:1; margin-bottom:0;}
  .opt-speak{flex:0 0 auto; padding:0 14px; border-radius:12px; font-size:1rem;}
  .opt.correct{background:var(--accent2) !important; color:#fff !important; border-color:var(--accent2) !important;}
  .opt.wrong{background:var(--danger) !important; color:#fff !important; border-color:var(--danger) !important;}
  .score{text-align:center; font-size:1.1rem; margin:20px 0;}
  .missed{font-size:0.85rem; color:var(--muted); margin-top:10px;}

  .write-hint{color:var(--muted); font-size:0.9rem; text-align:center; margin:-8px 0 18px;}
  .write-feedback{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px; margin-top:16px;}
  .write-feedback .verdict{font-weight:800; margin:0 0 8px;}
  .write-feedback .verdict.ok{color:var(--accent2);}
  .write-feedback .verdict.no{color:var(--danger);}
  .write-feedback .ref{color:var(--muted); margin:8px 0 0;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🇮🇩 印尼語 Flash Card</h1>
  <div class="sub">從單字清單勾選要複習的內容，開始 Flashcard 或測驗</div>

  <!-- ===== 選字畫面 ===== -->
  <div id="screen-select">
    <div class="toolbar">
      <button id="btnImport">匯入 / 更新單字檔 (.txt/.md)</button>
      <input type="file" id="fileInput" accept=".txt,.md">

      <button id="btnNone">全不選</button>

      <button id="btnRandomSelect">🎲 隨機選這麼多個來練習</button>
    </div>
    <div class="toolbar">
      <input type="password" id="apiKeyInput" placeholder="Anthropic API Key (sk-ant-...)">
      <button id="btnSaveKey">儲存 Key</button>
    </div>
    <div class="note">Key 只會存在這台電腦的瀏覽器裡（localStorage），不會上傳到別的地方。用來讓 AI 幫新單字自動生成翻譯和測驗句。</div>
    <div class="toolbar">
      <button id="btnGenerate">✨ AI 自動生成缺少的翻譯</button>
    </div>
    <div class="toolbar">

      <button id="btnToggleSelectedOnly">只顯示已選取</button>
    </div>
    <div class="count" id="selCount"></div>
    <div class="list" id="wordList"></div>
    <div class="actions">
      <button class="primary" id="btnStartCards">開始 Flash Card 複習</button>
      <button class="secondary" id="btnStartQuiz">開始測驗（英文選印尼文）</button>
      <button class="secondary" id="btnStartWrite">✍️ 中翻印尼文（AI 出句、AI 批改）</button>
    </div>

  <!-- ===== Flash Card 畫面 ===== -->
  <div id="screen-cards" class="hidden">
    <div class="progress" id="cardProgress"></div>
    <div class="card-area" id="cardArea">
      <div class="front" id="cardFront"></div>
      <div class="front-pron" id="cardPron"></div>
      <button type="button" class="listen-btn" id="cardSpeak">🔊 播放發音</button>
      <div class="back hidden" id="cardBack"></div>
    </div>
    <div class="nav hidden" id="cardAssessRow">
      <button id="btnCardWrong">✗ 還要練習</button>
      <button class="secondary" id="btnCardRight">✓ 記得了，不再出現</button>
    </div>
    <div class="nav">
      <button id="btnPrev">← 上一個</button>
      <button id="btnShuffleCards">🔀 洗牌</button>
      <button id="btnNext">下一個 →</button>
    </div>
    <div class="actions" style="margin-top:16px;">
      <button id="btnBackFromCards">返回清單</button>
    </div>

  <!-- ===== 測驗畫面 ===== -->
  <div id="screen-quiz" class="hidden">
    <div class="progress" id="quizProgress"></div>
    <div class="quiz-en" id="quizEnText"></div>
    <div id="quizOptions"></div>
    <div class="actions">
      <button class="primary hidden" id="btnNextQuestion">下一題</button>
      <button class="secondary hidden" id="btnMastered">✓ 已記住，不再出現</button>

  <!-- ===== 造句測驗畫面 ===== -->

    <div class="progress" id="writeProgress"></div>
    <div class="quiz-en" id="writeWord"></div>

    <textarea id="writeInput" rows="2" placeholder="把上面這句中文翻成印尼文..."></textarea>
    <div class="actions" style="margin-top:12px;">
      <button class="primary" id="btnSubmitWrite">送出</button>
      <button class="hidden" type="button" id="writeSpeak">🔊 聽範例句</button>
    </div>
    <div class="write-feedback hidden" id="writeFeedback"></div>
    <div class="actions" style="margin-top:16px;">
      <button class="primary hidden" id="btnNextWrite">下一題</button>

    </div>

  <!-- ===== 結算畫面 ===== -->

      <button id="btnBackFromResult">返回清單</button>

<script>
// ================= 語音播放 =================
let cachedVoices = [];
function refreshVoices(){ cachedVoices = speechSynthesis.getVoices(); }
if('speechSynthesis' in window){
  refreshVoices();
  speechSynthesis.addEventListener('voiceschanged', refreshVoices);
}
function speak(text, btn){
  if(!('speechSynthesis' in window)){ alert('這個瀏覽器不支援語音播放'); return; }
  speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'id-ID';
  utter.rate = 0.85;
  const voice = cachedVoices.find(v => v.lang.toLowerCase().startsWith('id'));
  if(voice) utter.voice = voice;
  if(btn){ btn.disabled = true; btn.classList.add('speaking'); }
  utter.onend = utter.onerror = () => { if(btn){ btn.disabled = false; btn.classList.remove('speaking'); } };
  speechSynthesis.speak(utter);
}

const LS_KEY = "flashcard_word_list_v1";

function loadWordList(){
  const saved = localStorage.getItem(LS_KEY);
  if(saved){
    try{ return JSON.parse(saved); }catch(e){}
  }
  return DEFAULT_WORDS.slice();
}
function saveWordList(list){
  localStorage.setItem(LS_KEY, JSON.stringify(list));
}

// ---- 已學會的單字（Flash Card 跟測驗分開記錄，互不影響） ----
const MASTERED_CARDS_LS = "flashcard_mastered_cards_v1";
const MASTERED_QUIZ_LS = "flashcard_mastered_quiz_v1";
const MASTERED_LEGACY_LS = "flashcard_mastered_v1";
function loadMasteredSet(key){
  try{ return new Set(JSON.parse(localStorage.getItem(key)) || []); }catch(e){ return new Set(); }
}
function saveMasteredSet(key, set){ localStorage.setItem(key, JSON.stringify([...set])); }

let cardMasteredIds = loadMasteredSet(MASTERED_CARDS_LS);
let quizMasteredIds = loadMasteredSet(MASTERED_QUIZ_LS);
// 舊版只有一個共用清單，第一次載入時把舊資料套用到兩個新清單，不遺失既有進度
if(!localStorage.getItem(MASTERED_CARDS_LS) && !localStorage.getItem(MASTERED_QUIZ_LS)){
  const legacy = loadMasteredSet(MASTERED_LEGACY_LS);
  if(legacy.size){
    cardMasteredIds = new Set(legacy);
    quizMasteredIds = new Set(legacy);
    saveMasteredSet(MASTERED_CARDS_LS, cardMasteredIds);
    saveMasteredSet(MASTERED_QUIZ_LS, quizMasteredIds);
  }
}
function saveCardMastered(){ saveMasteredSet(MASTERED_CARDS_LS, cardMasteredIds); }
function saveQuizMastered(){ saveMasteredSet(MASTERED_QUIZ_LS, quizMasteredIds); }

let allWords = loadWordList();

// ---- 已選取的單字（記住上次選取狀態，重新整理不會重置） ----
const SELECTED_LS = "flashcard_selected_v1";
function loadSelected(){
  const raw = localStorage.getItem(SELECTED_LS);
  if(raw === null) return null;
  try{ return new Set(JSON.parse(raw)); }catch(e){ return null; }
}
function saveSelected(){ localStorage.setItem(SELECTED_LS, JSON.stringify([...selected])); }

const savedSelected = loadSelected();
let selected = savedSelected
  ? new Set([...savedSelected].filter(id => allWords.some(w => w.id === id)))
  : new Set(allWords.map(w => w.id));
let showSelectedOnly = false;

// ---- AI 自動生成翻譯（用使用者自己的 Anthropic API Key） ----
const API_KEY_LS = "anthropic_api_key";
const CUSTOM_DB_LS = "custom_word_db_v1";

function loadCustomDB(){
  try{ return JSON.parse(localStorage.getItem(CUSTOM_DB_LS)) || {}; }catch(e){ return {}; }
}
function saveCustomDB(){ localStorage.setItem(CUSTOM_DB_LS, JSON.stringify(customDB)); }
function getApiKey(){ return localStorage.getItem(API_KEY_LS) || ""; }
function setApiKey(k){ localStorage.setItem(API_KEY_LS, k); }

let customDB = loadCustomDB();

function lookup(text){
  return customDB[text] || WORD_DB[text] || null;
}

function chunkArr(arr, size){
  const out = [];
  for(let i = 0; i < arr.length; i += size) out.push(arr.slice(i, i + size));
  return out;
}

async function generateWordData(words){
  const schema = {
    type: "object",
    properties: {
      entries: {
        type: "array",
        items: {
          type: "object",
          properties: {
            zh: { type: "string" },
            en: { type: "string" },
            pron: { type: "string" },
            quizEn: { type: "string" },
            correct: { type: "string" },
            distractors: { type: "array", items: { type: "string" } }
          },
          required: ["zh", "en", "pron", "quizEn", "correct", "distractors"],
          additionalProperties: false
        }
      }
    },
    required: ["entries"],
    additionalProperties: false
  };
  const list = words.map((w, i) => `${i + 1}. ${w}`).join("\n");
  const prompt = `你是印尼語教材編輯，正在幫一位母語為中文的學生製作 Flash Card 和測驗題。針對下面每一個印尼文單字或句子，依序提供：
- zh：繁體中文意思
- en：英文意思
- pron：這個單字/句子的發音標注，採用印尼文詞典 KBBI 的標音慣例——把每個字母 e 依照實際發音標注清楚：
  - 央中元音 schwa（弱化、輕聲的 e，例如 "besar"、"kecil" 的第一個 e）維持寫成一般的 e，不用加符號
  - 閉前元音 /e/（例如 "sore"、"meja" 的 e）標成 é
  - 開前元音 /ɛ/（例如 "enak" 的 e、"apel" 的 e）標成 è
  其餘字母照原樣，不用改；如果整個字/句子裡沒有任何 e，pron 就跟原文字一樣
- quizEn：一句能表達這個單字/片語意思的英文例句
- correct：quizEn 對應的、自然的印尼文翻譯句子（要用到這個目標單字/片語）
- distractors：3 個文法正確但意思錯誤、容易讓學習者混淆的印尼文句子選項（長度和風格接近 correct，但意思不同）

請依照輸入的順序，每個項目對應輸出一筆資料，不要合併、不要省略、數量要跟輸入一致。

單字清單：
${list}`;

  const parsed = await callClaude(prompt, schema, 4096);
  return parsed.entries;
}

async function callClaude(prompt, schema, maxTokens){
  const key = getApiKey();
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "content-type": "application/json",
      "x-api-key": key,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify({
      model: "claude-opus-4-8",
      max_tokens: maxTokens,
      output_config: { format: { type: "json_schema", schema } },
      messages: [{ role: "user", content: prompt }]
    })
  });
  if(!res.ok){
    const errBody = await res.text();
    throw new Error(`HTTP ${res.status}: ${errBody.slice(0, 300)}`);
  }
  const responseData = await res.json();
  if(responseData.stop_reason === "refusal"){
    throw new Error("Claude 拒絕回應這個請求");
  }
  const textBlock = (responseData.content || []).find(b => b.type === "text");
  if(!textBlock){
    throw new Error("沒有收到文字回應");
  }
  return JSON.parse(textBlock.text);
}

async function generateWriteSentences(wordList){
  const schema = {
    type: "object",
    properties: {
      sentences: {
        type: "array",
        items: {
          type: "object",
          properties: {
            zh: { type: "string" },
            usedWords: { type: "array", items: { type: "string" } }
          },
          required: ["zh", "usedWords"],
          additionalProperties: false
        }
      }
    },
    required: ["sentences"],
    additionalProperties: false
  };
  const list = wordList.map(w => {
    const data = lookup(w.text);
    return `- ${w.text}（${data ? data.zh : "無翻譯"}）`;
  }).join("\n");
  const prompt = `你是印尼語老師，以下是學生正在學的一批印尼文單字/片語（含中文意思）。
請幫學生設計「中翻印尼文」口說造句練習：把這些單字盡量自然地組合成幾句道地、口語的中文句子（像日常對話會講的那種，不要死板的教科書句），讓學生看中文練習翻成印尼文。

規則：
- 每一句盡量塞入越多目標單字越好，但只挑真的能自然放進同一句話的組合，不要為了塞字讓句子變得不自然
- 每句最多用到約 5 個目標單字
- 清單裡的每個單字至少要出現在其中一句
- 句數依單字量彈性決定，不用剛好整除

單字清單：
${list}

請回傳 sentences 陣列，每個元素是 { zh：中文句子, usedWords：這句實際用到的目標單字原文列表（從清單裡一字不差複製） }`;
  const parsed = await callClaude(prompt, schema, 3072);
  return parsed.sentences;
}

async function gradeTranslation(zhSentence, targetWords, userAnswer){
  const schema = {
    type: "object",
    properties: {
      correct: { type: "boolean" },
      wordsUsedCorrectly: { type: "array", items: { type: "string" } },
      feedback: { type: "string" },
      betterSentence: { type: "string" }
    },
    required: ["correct", "wordsUsedCorrectly", "feedback", "betterSentence"],
    additionalProperties: false
  };
  const prompt = `你是印尼語老師，學生要把這句中文口語翻成印尼文：
「${zhSentence}」

理想上應該自然地用到這些印尼文單字/片語：${targetWords.join("、")}
（不強制每個字都要出現，但整體翻譯的意思要對、要口語自然）

學生寫的答案：「${userAnswer}」

請判斷：
1. correct：整體翻譯的意思是否正確、通順自然（不要求跟目標單字的形式完全一致，同義的自然說法也算對）
2. wordsUsedCorrectly：學生的答案裡，有正確對應到（或用同義說法對應到）的目標單字，從目標單字清單裡列出
3. feedback：用繁體中文簡短說明哪裡對、哪裡需要調整（1-2 句就好）
4. betterSentence：一句自然、正確、口語的印尼文參考翻譯`;
  return callClaude(prompt, schema, 1024);
}

document.getElementById("apiKeyInput").value = getApiKey();
document.getElementById("btnSaveKey").onclick = () => {
  const v = document.getElementById("apiKeyInput").value.trim();
  if(!v){ alert("請輸入 API Key"); return; }
  setApiKey(v);
  alert("已儲存 Key。");
};

document.getElementById("btnGenerate").onclick = async () => {
  if(!getApiKey()){
    alert("請先輸入並儲存 API Key。");
    return;
  }
  const missing = allWords.filter(w => !lookup(w.text));
  if(missing.length === 0){
    alert("目前清單裡的單字都已經有翻譯了！");
    return;
  }
  const btn = document.getElementById("btnGenerate");
  btn.disabled = true;
  const batches = chunkArr(missing, 8);
  let done = 0;
  for(const batch of batches){
    btn.textContent = `生成中... (${done}/${missing.length})`;
    try{
      const entries = await generateWordData(batch.map(w => w.text));
      batch.forEach((w, i) => { if(entries[i]) customDB[w.text] = entries[i]; });
      saveCustomDB();
      done += batch.length;
      renderList();
    }catch(e){
      alert("生成失敗：" + e.message);
      btn.disabled = false;
      btn.textContent = "✨ AI 自動生成缺少的翻譯";
      return;
    }
  }
  btn.disabled = false;
  btn.textContent = "✨ AI 自動生成缺少的翻譯";
  renderList();
};

function getVisibleWords(){
  const query = document.getElementById("wordSearch").value.trim().toLowerCase();
  return allWords.filter(w => {
    if(showSelectedOnly && !selected.has(w.id)) return false;
    if(!query) return true;
    const data = lookup(w.text);
    const haystack = `${w.text} ${data ? data.zh : ""} ${data ? data.en : ""}`.toLowerCase();
    return haystack.includes(query);
  });
}

function renderList(){
  const el = document.getElementById("wordList");
  el.innerHTML = "";
  const visibleWords = getVisibleWords();
  if(visibleWords.length === 0){
    el.innerHTML = `<div class="item"><div class="meaning">沒有符合的單字</div></div>`;
  }
  visibleWords.forEach(w => {
    const data = lookup(w.text);
    const row = document.createElement("label");
    row.className = "item" + (data ? "" : " no-data");
    row.innerHTML = `
      <input type="checkbox" data-id="${w.id}" ${selected.has(w.id) ? "checked" : ""}>
      <div>
        <div class="id-text">${w.id}. ${w.text}${data && data.pron && data.pron !== w.text ? ` <span class="pron">[${data.pron}]</span>` : ""}</div>
        <div class="meaning">${data ? (data.zh + " · " + data.en) : "尚無翻譯資料，可用上面「AI 自動生成」按鈕"}</div>
      </div>
    `;
    row.querySelector("input").addEventListener("change", (e) => {
      const id = Number(e.target.dataset.id);
      if(e.target.checked) selected.add(id); else selected.delete(id);
      saveSelected();
      if(showSelectedOnly) renderList(); else updateCount();
    });
    if(cardMasteredIds.has(w.id) || quizMasteredIds.has(w.id)){
      const badgeRow = document.createElement("div");
      badgeRow.className = "badge-row";
      if(cardMasteredIds.has(w.id)){
        const b = document.createElement("button");
        b.type = "button"; b.className = "badge";
        b.textContent = "🎴 卡片已學會 ✕";
        b.addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); cardMasteredIds.delete(w.id); saveCardMastered(); renderList(); });
        badgeRow.appendChild(b);
      }
      if(quizMasteredIds.has(w.id)){
        const b = document.createElement("button");
        b.type = "button"; b.className = "badge";
        b.textContent = "📝 測驗已學會 ✕";
        b.addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); quizMasteredIds.delete(w.id); saveQuizMastered(); renderList(); });
        badgeRow.appendChild(b);
      }
      row.querySelector("div").appendChild(badgeRow);
    }
    const speakBtn = document.createElement("button");
    speakBtn.type = "button";
    speakBtn.className = "speak-btn";
    speakBtn.textContent = "🔊";
    speakBtn.setAttribute("aria-label", `播放 ${w.text} 發音`);
    speakBtn.addEventListener("click", (e) => { e.stopPropagation(); speak(w.text, speakBtn); });
    row.appendChild(speakBtn);
    const deleteBtn = document.createElement("button");
    deleteBtn.type = "button";
    deleteBtn.className = "delete-btn";
    deleteBtn.textContent = "🗑️";
    deleteBtn.setAttribute("aria-label", `刪除 ${w.text}`);
    deleteBtn.addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); deleteWord(w.id); });
    row.appendChild(deleteBtn);
    el.appendChild(row);
  });
  updateCount();
}
function updateCount(){
  const parts = [`已選 ${selected.size} / ${allWords.length} 個單字`];
  if(cardMasteredIds.size) parts.push(`卡片已會 ${cardMasteredIds.size}`);
  if(quizMasteredIds.size) parts.push(`測驗已會 ${quizMasteredIds.size}`);
  document.getElementById("selCount").textContent = parts.join("・");
}
function deleteWord(id){
  allWords = allWords.filter(w => w.id !== id);
  saveWordList(allWords);
  selected.delete(id);
  saveSelected();
  cardMasteredIds.delete(id);
  quizMasteredIds.delete(id);
  saveCardMastered();
  saveQuizMastered();
  renderList();
}

document.getElementById("btnAll").onclick = () => {

document.getElementById("btnNone").onclick = () => {

// ---- 匯入 txt/md（自動去除中文意思、注音口訣、Markdown 符號，只留印尼文） ----
const CJK_RE = /[\u3000-\u303f\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff\uff00-\uffef]+/g;

function extractIndonesianLine(raw){
  let s = raw.replace(/\r/g, "").trim();
  if(s === "") return null;
  if(s.startsWith("[")) return null;        // [🔗 分類標題] 這種區塊標題
  if(/^-{2,}$/.test(s)) return null;        // --- 分隔線
  s = s.replace(/\*\*/g, "");               // 去掉 **粗體**
  s = s.replace(/^\d+[\.\)]\s*/, "");       // 去掉「1. 」「1) 」編號
  s = s.replace(/^[\s\-\*]+/, "");          // 去掉「- 」「* 」項目符號
  // 從第一個箭頭（> / -> / →）開始，後面通常是注音口訣，整段丟掉
  const arrowMatch = s.match(/-+>|→|>/);
  if(arrowMatch) s = s.slice(0, arrowMatch.index);
  s = s.replace(/[（(][^）)]*[）)]/g, "");   // 去掉（中文意思）這種括號
  s = s.replace(CJK_RE, " ");               // 去掉殘留的中文字
  s = s.replace(/\s+/g, " ");
  s = s.replace(/[\s:\/=,\-]+$/, "").replace(/^[\s:\/=,\-]+/, "");
  s = s.trim();
  if(s === "") return null;
  if(!/[a-zA-Z]/.test(s)) return null;      // 沒有拉丁字母就不是印尼文，跳過
  return s;
}

document.getElementById("btnImport").onclick = () => document.getElementById("fileInput").click();
document.getElementById("fileInput").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const lines = ev.target.result.split(/\r?\n/);
    const parsed = [];
    const seen = new Set();
    let autoId = 0;
    lines.forEach(line => {
      const cleaned = extractIndonesianLine(line);
      if(cleaned === null) return;
      const key = cleaned.toLowerCase();
      if(seen.has(key)) return;
      seen.add(key);
      autoId++;
      parsed.push({ id: autoId, text: cleaned });
    });
    if(parsed.length === 0){
      alert("沒有解析到任何印尼文單字，請確認檔案內容。");
      return;
    }
    allWords = parsed;
    saveWordList(allWords);
    selected = new Set(allWords.map(w => w.id));
    saveSelected();
    cardMasteredIds = new Set();
    quizMasteredIds = new Set();
    saveCardMastered();
    saveQuizMastered();
    renderList();
    alert(`已匯入 ${parsed.length} 個項目。`);
  };
  reader.readAsText(file, "UTF-8");
});

// ================= Flash Card =================

let cardIndex = 0;

  document.getElementById("cardFront").textContent = w.text;

  document.getElementById("cardBack").textContent = data ? `${data.zh}（${data.en}）` : "尚無翻譯資料";

}
document.getElementById("cardArea").onclick = () => {

};
document.getElementById("cardSpeak").addEventListener("click", (e) => {

});
document.getElementById("btnPrev").onclick = () => {

};
document.getElementById("btnNext").onclick = () => {
  cardIndex = (cardIndex + 1) % cardSession.length;

function goToNextCard(){

}
document.getElementById("btnCardWrong").onclick = () => {
  goToNextCard();
};
document.getElementById("btnCardRight").onclick = () => {
  const w = cardSession[cardIndex];

  saveCardMastered();

  }
  cardIndex = cardIndex % cardSession.length;

};

// ================= 測驗 =================
let quizSession = [];
let quizIndex = 0;
let quizScore = 0;
let quizMissed = [];
let quizRetryPool = null;

document.getElementById("btnStartQuiz").onclick = () => {
  const list = allWords.filter(w => selected.has(w.id) && !quizMasteredIds.has(w.id));
  const ready = list.filter(w => lookup(w.text) && lookup(w.text).correct);
  const skipped = list.length - ready.length;
  if(ready.length === 0){ alert("勾選的單字都還沒有測驗例句，或都已經在測驗標記學會了，請調整清單。"); return; }
  if(skipped > 0){
    alert(`有 ${skipped} 個單字尚無測驗例句，已略過。`);
  }
  quizSession = shuffleArr(ready.slice());
  quizIndex = 0;
  quizScore = 0;
  quizMissed = [];
  showScreen("quiz");
  renderQuestion();
};

function renderQuestion(){
  const w = quizSession[quizIndex];
  const data = lookup(w.text);
  document.getElementById("quizProgress").textContent = `第 ${quizIndex+1} / ${quizSession.length} 題`;
  document.getElementById("quizEnText").textContent = data.quizEn;
  const options = shuffleArr([data.correct, ...data.distractors]);
  const optEl = document.getElementById("quizOptions");
  optEl.innerHTML = "";
  document.getElementById("btnNextQuestion").classList.add("hidden");
  document.getElementById("btnMastered").classList.add("hidden");
  options.forEach(opt => {
    const row = document.createElement("div");
    row.className = "opt-row";
    const b = document.createElement("button");
    b.className = "opt";
    b.textContent = opt;
    b.onclick = () => answerQuestion(b, opt, data.correct, w);
    const speakBtn = document.createElement("button");
    speakBtn.type = "button";
    speakBtn.className = "opt-speak";
    speakBtn.textContent = "🔊";
    speakBtn.setAttribute("aria-label", `播放「${opt}」發音`);
    speakBtn.addEventListener("click", (e) => { e.stopPropagation(); speak(opt, speakBtn); });
    row.appendChild(b);
    row.appendChild(speakBtn);
    optEl.appendChild(row);
  });
}
function answerQuestion(btn, chosen, correct, word){
  const buttons = document.querySelectorAll("#quizOptions .opt");
  buttons.forEach(b => b.disabled = true);
  if(chosen === correct){
    btn.classList.add("correct");
    quizScore++;
    if(!quizMasteredIds.has(word.id)){
      document.getElementById("btnMastered").classList.remove("hidden");
    }
  }else{
    btn.classList.add("wrong");
    buttons.forEach(b => { if(b.textContent === correct) b.classList.add("correct"); });
    quizMissed.push(word);
  }
  document.getElementById("btnNextQuestion").classList.remove("hidden");
}
function goToNextQuestion(){
  quizIndex++;
  if(quizIndex >= quizSession.length){
    showResult();
  }else{
    renderQuestion();
  }
}
document.getElementById("btnNextQuestion").onclick = goToNextQuestion;
document.getElementById("btnMastered").onclick = () => {
  const w = quizSession[quizIndex];
  quizMasteredIds.add(w.id);
  saveQuizMastered();
  goToNextQuestion();
};
document.getElementById("btnBackFromQuiz").onclick = () => showScreen("select");

// ================= 中翻印尼文（AI 出句、AI 批改） =================
let writeSession = [];
let writeIndex = 0;
let writeScore = 0;
let writeGrading = false;

document.getElementById("btnStartWrite").onclick = async () => {
  if(!getApiKey()){ alert("這個模式需要用 AI 出題跟批改，請先在上面輸入並儲存 API Key。"); return; }
  const list = allWords.filter(w => selected.has(w.id));
  const ready = list.filter(w => lookup(w.text));
  const skipped = list.length - ready.length;
  if(ready.length === 0){ alert("勾選的單字都還沒有翻譯資料，請先選有翻譯資料的單字，或用「AI 自動生成」補上。"); return; }
  if(skipped > 0){
    alert(`有 ${skipped} 個單字尚無翻譯資料，已略過。`);
  }
  const startBtn = document.getElementById("btnStartWrite");
  startBtn.disabled = true;
  const batches = chunkArr(ready, 12);
  const sentences = [];
  try{
    for(let i = 0; i < batches.length; i++){
      startBtn.textContent = `AI 出題中... (${i + 1}/${batches.length})`;
      const batchSentences = await generateWriteSentences(batches[i]);
      sentences.push(...batchSentences);
    }
  }catch(e){
    startBtn.disabled = false;
    startBtn.textContent = "✍️ 中翻印尼文（AI 出句、AI 批改）";
    alert("出題失敗：" + e.message);
    return;
  }
  startBtn.disabled = false;
  startBtn.textContent = "✍️ 中翻印尼文（AI 出句、AI 批改）";
  if(sentences.length === 0){ alert("沒有產生出任何句子，請再試一次。"); return; }
  writeSession = shuffleArr(sentences);
  writeIndex = 0;
  writeScore = 0;
  showScreen("write");
  renderWriteQuestion();
};

function renderWriteQuestion(){
  const s = writeSession[writeIndex];
  document.getElementById("writeProgress").textContent = `第 ${writeIndex + 1} / ${writeSession.length} 題`;
  document.getElementById("writeWord").textContent = s.zh;
  document.getElementById("writeHint").textContent = s.usedWords && s.usedWords.length ? `可用單字參考：${s.usedWords.join("、")}` : "";
  const input = document.getElementById("writeInput");
  input.value = "";
  input.disabled = false;
  input.classList.remove("hidden");
  const submitBtn = document.getElementById("btnSubmitWrite");
  submitBtn.classList.remove("hidden");
  submitBtn.disabled = false;
  submitBtn.textContent = "送出";
  document.getElementById("writeSpeak").classList.add("hidden");
  document.getElementById("writeFeedback").classList.add("hidden");
  document.getElementById("writeFeedback").innerHTML = "";
  document.getElementById("btnNextWrite").classList.add("hidden");
  input.focus();
}

document.getElementById("btnSubmitWrite").addEventListener("click", async () => {
  if(writeGrading) return;
  const input = document.getElementById("writeInput");
  const answer = input.value.trim();
  if(!answer){ alert("請先輸入句子"); return; }
  const s = writeSession[writeIndex];
  const submitBtn = document.getElementById("btnSubmitWrite");
  writeGrading = true;
  submitBtn.disabled = true;
  submitBtn.textContent = "批改中...";
  try{
    const result = await gradeTranslation(s.zh, s.usedWords || [], answer);
    writeGrading = false;
    input.disabled = true;
    submitBtn.classList.add("hidden");
    if(result.correct) writeScore++;
    const fb = document.getElementById("writeFeedback");
    fb.classList.remove("hidden");
    fb.innerHTML = `
      <p class="verdict ${result.correct ? "ok" : "no"}">${result.correct ? "✓ 不錯！" : "還需要調整"}</p>
      <p>${result.feedback}</p>
      ${result.wordsUsedCorrectly && result.wordsUsedCorrectly.length ? `<p>有正確用到：${result.wordsUsedCorrectly.join("、")}</p>` : ""}
      <p class="ref">參考翻譯：${result.betterSentence}</p>
    `;
    const speakBtn = document.getElementById("writeSpeak");
    speakBtn.classList.remove("hidden");
    speakBtn.onclick = () => speak(result.betterSentence, speakBtn);
    document.getElementById("btnNextWrite").classList.remove("hidden");
  }catch(e){
    writeGrading = false;
    submitBtn.disabled = false;
    submitBtn.textContent = "送出";
    alert("批改失敗：" + e.message);
  }
});

document.getElementById("btnNextWrite").onclick = () => {
  writeIndex++;
  if(writeIndex >= writeSession.length){
    finishWriteSession();
  }else{
    renderWriteQuestion();
  }
};
document.getElementById("btnBackFromWrite").onclick = () => showScreen("select");

function finishWriteSession(){
  document.getElementById("writeProgress").textContent = "完成";
  document.getElementById("writeWord").textContent = `你答對了 ${writeScore} / ${writeSession.length} 題`;
  document.getElementById("writeHint").textContent = "";
  document.getElementById("writeInput").classList.add("hidden");
  document.getElementById("btnSubmitWrite").classList.add("hidden");
  document.getElementById("writeSpeak").classList.add("hidden");
  document.getElementById("writeFeedback").classList.add("hidden");
  document.getElementById("btnNextWrite").classList.add("hidden");
}

function showResult(){
  showScreen("result");
  document.getElementById("resultScore").textContent = `你答對了 ${quizScore} / ${quizSession.length} 題`;
  const missedEl = document.getElementById("resultMissed");
  if(quizMissed.length > 0){
    missedEl.textContent = "答錯的單字：" + quizMissed.map(w => w.text).join("、");
    document.getElementById("btnRetryMissed").classList.remove("hidden");
  }else{
    missedEl.textContent = "全部答對，太厲害了！";
    document.getElementById("btnRetryMissed").classList.add("hidden");
  }
}
document.getElementById("btnRetryMissed").onclick = () => {
  quizSession = shuffleArr(quizMissed.slice());
  quizIndex = 0;
  quizScore = 0;
  quizMissed = [];
  showScreen("quiz");
  renderQuestion();
};
document.getElementById("btnBackFromResult").onclick = () => showScreen("select");

// ================= 共用 =================
function shuffleArr(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function showScreen(name){
  ["select","cards","quiz","write","result"].forEach(s => {
    document.getElementById("screen-" + s).classList.toggle("hidden", s !== name);
  });
  if(name === "select") renderList();
}

renderList();
